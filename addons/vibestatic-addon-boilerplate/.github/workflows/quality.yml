name: quality

# The same shape as the core's. Upstream shipped codequality.yml, which had not
# started in years: actions/checkout@v2 and actions/cache@v1 are both disabled,
# so every run died at its first step and the badge said nothing.

on:
  push:
    branches: [main, vibestatic]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Validate composer.json
        run: composer validate --strict

      # Blocking, and the reason this file exists. These are the sniffs the
      # upstream configuration excluded - prepared SQL, nonces, escaping,
      # sanitised input - which is to say exactly the ones that would have found
      # every defect in the audit.
      - name: Security (blocking)
        run: composer run-script phpcs-security

      - name: Style and documentation (non-blocking)
        continue-on-error: true
        run: composer run-script phpcs

      - name: i18n (blocking)
        run: composer run-script phpcs-i18n

      - name: PHP 8.2+ compatibility
        run: composer run-script phpcompat

      - name: PHPStan
        run: composer run-script phpstan

  tests:
    name: Tests, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Lint
        run: composer run-script lint

      - name: Test
        run: composer run-script phpunit
